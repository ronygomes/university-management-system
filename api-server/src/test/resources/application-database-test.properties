# Test Containers provides custom JDBC URLs which creates container on-the-fly
# Unlike container created using code, this allows to read init-scripts from outside classpath
# Following URL will create resource at random port in localhost. Note: `:tc` in URL
spring.datasource.url=jdbc:tc:postgresql:16.0:///ums?TC_INITSCRIPT=file:init.sql
spring.datasource.driverClassName=org.testcontainers.jdbc.ContainerDatabaseDriver

spring.datasource.username=user
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
