services:
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.3
    container_name: keycloak
    command: 
      - "start-dev"
      - "--http-port=8000"
      - "--import-realm" 
    ports:
      - "8000:8000"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ./ums-realm.json:/opt/keycloak/data/import/ums-realm.json:ro
