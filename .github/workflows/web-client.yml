name: web-client

on:
  push:
    branches: [ main ]
    paths:
      - 'web-client/**'
      - '.github/workflows/web-client.yml'
  pull_request:
    paths:
      - 'web-client/**'
      - '.github/workflows/web-client.yml'

concurrency:
  group: web-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
